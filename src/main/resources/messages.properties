# ---------------------------------------------------------------------------
# 既定のメッセージ (どのロケールにも当てはまらなかったときに使われる)
#
#   messages.properties      ← このファイル。言語を付けない「最後の受け皿」
#   messages_ja.properties   ← 日本語
#   messages_en.properties   ← 英語
#
# 探す順番は次のとおりです。
#   1. messages_<言語>_<国>.properties   例: messages_ja_JP.properties
#   2. messages_<言語>.properties        例: messages_ja.properties
#   3. JVM の既定ロケールの 1. と 2.     ← 見落としやすい落とし穴
#   4. messages.properties               ← このファイル
#
# Java 9 以降、properties ファイルは UTF-8 として読まれます。
# (Java 8 以前は ISO-8859-1 だったため、native2ascii で \uXXXX に変換していました)
# ---------------------------------------------------------------------------
page.title=Order form
page.lead=A sample screen that switches its language.
message.welcome=Welcome, {0}.
message.orders=You have {0} order(s) to process.
label.name=Name
label.orderDate=Order date
label.amount=Amount
label.quantity=Quantity
button.submit=Submit
