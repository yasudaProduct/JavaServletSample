# 日本語のメッセージ。ロケールが ja のときに使われます。
#
# 画面に出す文字を .properties にまとめておくと、
# 「文言を直したいだけなのに JSP を触る」ことがなくなります。
# 言語を増やすときも、ファイルを 1 つ足すだけで済みます。
page.title=注文フォーム
page.lead=表示する言語を切り替えるサンプル画面です。
# {0} には fmt:param で渡した値が入ります
message.welcome=ようこそ、{0} さん。
message.orders=未処理の注文が {0} 件あります。
label.name=氏名
label.orderDate=注文日
label.amount=金額
label.quantity=数量
button.submit=送信する
